# Dependency updates (docs/adr/0008). Weekly, grouped so minor and patch bumps arrive as one PR
# per ecosystem; majors come one by one. pnpm uses the npm ecosystem. Security updates for
# known vulnerabilities come as they're published; enable Dependabot alerts and security
# updates in the repository's settings (Code security).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
